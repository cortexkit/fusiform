# The guarded gate has to be SHORTER to type than the unguarded one.
#
# `cargo test` is a lock WRITER: if a manifest and the lock disagree, it
# silently re-resolves and rewrites Cargo.lock, and a later `git add -A` folds
# that into a commit about something else. Measured on this repo's history:
# eleven commits carry a dependency version move under a message about WAL
# guarantees, provenance axes and domain-type fences.
#
# `--locked` makes cargo a reader, so a disagreement REFUSES instead of being
# absorbed silently, and updating the lock becomes a deliberate `cargo update`
# in its own commit.
#
# The alias rather than a script, and the short name rather than a clear one,
# because a guarded path that costs more keystrokes gets skipped exactly when
# it matters most. `cargo t` is shorter than `cargo test`, so the guarded
# spelling wins on the days discipline does not.
[alias]
t = "test --locked"
# `-D warnings` because CI runs with it: without the flag this alias answers
# "are there errors" while the gate that decides the push answers "are there
# warnings OR errors", and the two agree until they do not. A clean local run
# that CI rejects is the worst shape a gate can have — it spends a train run to
# tell you something the alias could have.
c = "clippy --locked --workspace --all-targets -- -D warnings"
