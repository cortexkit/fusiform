name: CI

on:
  push:
    # `train/**` is a precondition for CI-gated train branches, not a
    # convenience: under required status checks, main is only pushable by a sha
    # that already carries a green check. A trigger limited to master means a
    # train push produces no run, so no sha ever earns one and main becomes
    # unpushable — the protection waits forever for a check that cannot arrive.
    #
    # Widened BEFORE enabling protection, which is the order that matters.
    branches: [master, 'train/**']
  pull_request:
  workflow_call:
  # A push gate asks "is this change good". Only a scheduled run asks "is what
  # already landed still good against the world as it is now".
  #
  # Every dependency is a crates.io version pinned in Cargo.lock, so the lock
  # cannot go stale beneath a still commit. What still changes on its own is
  # the DATE: the curated plan-price and window-overlay review gates and the
  # seed freshness gate fail when time passes with nothing touched, and a
  # push-only gate is silent for exactly the quiet stretch in which those dates
  # lapse. The toolchain moves too, since CI takes `stable`.
  #
  # THE DECLARED TIME IS NOT THE DELIVERED TIME, and the gap is hours.
  #
  # Measured over every scheduled run this repo has (n=13, 2026-09-07 to
  # 2026-09-19): declared 06:00 UTC, fired between 09:50 and 11:19, mean +4h31m.
  # Not one landed within three hours of the cron.
  #
  #     min  +3h50m      mean  +4h31m      max  +5h19m
  #
  # WHY THIS IS WRITTEN DOWN. I spent several turns saying "the cron fires at
  # 10:00Z" — which is the OBSERVED delivery time quoted as if it were the
  # schedule. Anyone reading this line expects 06:00 and is wrong by half a
  # working morning, and anyone treating a run as overdue at 07:00 is wrong the
  # other way.
  #
  # THE CAUSE IS UNMEASURED and I am not guessing at one. GitHub documents that
  # scheduled workflows are delayed under load, which predicts jitter; this is a
  # consistent offset with ±40 minutes of spread around it, which that
  # explanation does not obviously fit. Recorded as a measurement rather than a
  # mechanism, because a named cause nobody verified is the thing a future
  # reader would stop investigating at.
  #
  # WHAT IT DOES NOT CHANGE: the schedule's purpose is to fire when nobody is
  # attending, so a fixed delay costs nothing. It matters only for reasoning
  # about WHEN an answer arrives — including whether a run is missing or merely
  # late, which is the check that sent me here.
  #
  # Re-derive rather than trusting these numbers, since they are a dated
  # measurement of someone else's infrastructure:
  #
  #     gh run list --workflow=ci.yml --event schedule --limit 20 \
  #       --json createdAt --jq '.[].createdAt'
  #
  # DO NOT CHANGE THIS CRON BEFORE 2026-11-02. IT IS A CONTROL ARM.
  #
  # Three repos measured, two declared minutes and two declared hours:
  #
  #     cerebellum    04:17     n=14   mean +4h54m
  #     fusiform      06:00     n=13   mean +4h31m
  #     subconscious  06:00     n=14   mean +4h19m
  #
  # Delivery TRACKS the declared time -- cerebellum declares 1h43m earlier and
  # delivers 1h20m earlier -- so this is an offset rather than a fixed delivery
  # slot, and the popular-minute story is dead (17 does not sit apart from 0).
  #
  # Two explanations survive and they are the SAME EQUATION to within the
  # jitter:
  #
  #     constant offset   delivery = declared_UTC + ~4.5h
  #     timezone          cron read as US Eastern (UTC-4) + 20-55m of ordinary
  #                       queue delay
  #
  # Moving a declared time cannot separate them: subconscious's `17 3` predicts
  # 07:45Z under one and 07:47Z under the other. Agreement is only evidence when
  # the instruments could have disagreed.
  #
  # THE FREE DISCRIMINATOR IS A DST BOUNDARY, and it is dated. America/New_York
  # leaves daylight time at 2026-11-01 06:00Z (verified against the tz database
  # here, not from the first-Sunday rule). Under a UTC reading this cron keeps
  # delivering ~10:52Z (its 2026-09-21..27 mean; the table above is older); under an Eastern reading `0 6` moves from 06:00 EDT
  # (10:00Z) to 06:00 EST (11:00Z), an hour later.
  #
  # EXPECT ABOUT 40 MINUTES OF SHIFT, NOT 60. After subconscious moved to
  # `17 3`, the seven days 2026-09-21..27 gave mean delays of 334m (03:17),
  # 317m (04:17) and 292m (06:00): the later a run fires, the less it waits,
  # about 15-20 minutes less per hour. An hour-later fire therefore arrives
  # roughly 40 minutes later, on a repo that changed nothing.
  #
  # AND IT DOES NOT RESOLVE ON ONE READING. The day-to-day spread inside a
  # single repo is 17-24 minutes (sd), so a ~40-minute shift is under 2 sigma
  # on ONE observation -- and exactly the reading that gets called conclusive
  # because it points the way you expected.
  #
  #     11-01   2 arms          suggestive at best
  #     11-02   3 arms          still weak
  #     11-05   ~12 readings    SE ~8-10m, ~4-5 sigma, the first real read
  #
  # Compare across PAIRS AT MATCHED GAPS, not pooled. Day-to-day noise is
  # shared between repos in proportion to how close their declared times are
  # (paired-difference sd: 0 min apart 2.8m, 60 min 4.9m, 103 min 10.5-10.9m,
  # 163 min 15.5m), so a pooled figure mixes correlated and independent noise.
  #
  # The spread of means across repos in the table above is not the noise on a
  # single draw, which is wider, and conflating the two is how a two-sigma hint
  # becomes a settled result.
  #
  # Which is the whole value of holding still: a repo that changed NOTHING
  # across the boundary separates a timezone shift from whatever else GitHub
  # does in October. Subconscious moved to a fourth declaration point in
  # September, so if this one moved too, neither could tell those apart.
  #
  # USE 2026-11-02, NOT 11-01. The transition instant is 06:00Z, which is
  # exactly this cron's declared time, so the 11-01 firing sits on the boundary
  # and is ambiguous by construction. Cerebellum's 04:17 is clean on 11-01.
  schedule:
    - cron: '0 6 * * *'

# Keyed on the event as well as the ref. The nightly runs on master's ref, and
# its mutation replay takes hours; keyed on the ref alone, any push to master
# in that window cancels the nightly, so on a busy day the full replay never
# completes and its absence reads like a pass. Pushes still cancel superseded
# pushes, and a newer schedule still cancels an older one.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Linux-only: fusiform has no platform-specific code paths. It is domain
  # logic, SQLite through cortexkit-store, and an HTTP fetch; the wire layer
  # talks to the subc daemon through the SDK.
  test:
    name: Test (ubuntu)
    runs-on: ubuntu-latest
    # A wedged test must surface as a fast red run rather than burning the
    # runner for the 6-hour Actions default. Healthy runs finish in minutes.
    timeout-minutes: 20
    steps:
      - name: Checkout fusiform
        uses: actions/checkout@v5
        with:
          # Full history so the version-discipline check can diff against
          # origin/master. The default depth of 1 makes that ref unresolvable.
          fetch-depth: 0

      # Every dependency, CortexKit crates included, comes from crates.io, so
      # the repository builds from its own checkout with no siblings beside it
      # and no cross-repository token.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      # `--all-targets` so the integration tests run, which is where every
      # guard in this repository lives.
      #
      # FUSIFORM_LIVE and FUSIFORM_FULL_PAYLOAD are deliberately unset. The
      # tests they gate reach models.dev or read a captured multi-megabyte
      # document, and a suite whose result depends on a third party's uptime
      # reports someone else's outage as this repository's failure.
      - name: Test
        # --locked proves the committed tree can reproduce its own build.
        #
        # Without it, a stale Cargo.lock passes silently: cargo updates it in
        # place during the run and the change is discarded with the runner. The
        # only thing that catches it is the release script at deploy time,
        # which is the worst moment to discover a tree cannot build from what
        # it committed.
        #
        # This is not hypothetical here — a wire-crate version bump landed
        # without its lock update, CI went green, and the release build refused
        # minutes later. A version and its lock entry are two artifacts of one
        # change, and nothing was comparing them.
        run: cargo test --locked --workspace --all-targets

      # The served schema is what consumers compile against, and a consumer
      # that path-depends on this repo cannot see a code change that does not
      # move the version: Cargo.lock records a path dep with no source and no
      # checksum, so `--locked` passes over moved code.
      #
      # Fetch depth 0 above so origin/master resolves for the comparison.
      - name: Served schema version discipline
        run: ./scripts/check-wire-crate-version.sh origin/master

  # Replays the mutation proofs in mutations.toml: each row breaks one guarded
  # rule and names the test that must go red. A proof written once and never
  # rerun stops proving anything the moment a later edit makes its test
  # vacuous, and nothing announces that; this job is what announces it.
  #
  # A push or pull request replays only the rows whose mutated file, test file
  # or catalogue entry the change touched, which keeps a typical push to a few
  # rows. The schedule replays every row, because a change to a helper or
  # fixture that a guarding test leans on selects nothing here and only the
  # full run sees it.
  mutations:
    name: Mutation proofs (ubuntu)
    runs-on: ubuntu-latest
    # Every replayed row rebuilds its package's test binary with the mutant in
    # place, and that rebuild, not the test run, is nearly all the time: a full
    # replay measured 2h52m locally for 28 rows on a loaded machine, almost all
    # of it in builds. So the nightly gets close to the hosted runner's
    # six-hour job limit, while a push or pull request, which replays a few
    # rows, is held to a bound that still notices a hang.
    timeout-minutes: ${{ github.event_name == 'schedule' && 330 || 45 }}
    steps:
      - name: Checkout fusiform
        uses: actions/checkout@v5
        with:
          # Full history: the selection below diffs against an earlier commit,
          # which a depth-1 clone does not have.
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      # Pinned to a reviewed commons commit. commons commits its Cargo.lock, so
      # --locked builds the runner from that commit's own lock: the pin fixes
      # the runner's dependencies as well as its code.
      - name: Install ck-mutate
        run: >-
          cargo install --locked --git https://github.com/cortexkit/commons
          --rev c46f324133c5df6411703714e4c147f7cc8554a0 cortexkit-mutate

      # Validates every row's anchor, files and expected test names before any
      # source is touched, so a stale row fails here by name.
      - name: Check the catalogue
        run: ck-mutate check

      # One step for every event, choosing the base in shell, so each event
      # runs the same steps. A master push diffs against the commit it replaced.
      # When that commit is not in the clone (the all-zeros `before` of a new
      # branch, or a force-push's discarded tip) it falls back to the
      # merge-base, as a train/** push always does.
      - name: Replay mutation proofs
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          merge_base() { git merge-base origin/master HEAD; }
          case "$EVENT" in
            schedule)
              # --broad runs every test target in each row's package, not only
              # the one the row names, so a mutant that also reddens tests in
              # another target is graded CAUGHT_BROADLY: caught, but by a
              # breakage wider than the rule it was written for. It costs a
              # wider test run per row, so only the nightly pays it.
              selection=(--all --broad) ;;
            pull_request)
              selection=(--diff "$PR_BASE") ;;
            push)
              if [ "$REF" = refs/heads/master ] \
                && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
                selection=(--diff "$BEFORE")
              else
                selection=(--diff "$(merge_base)")
              fi ;;
            *)
              # Any other trigger (a calling workflow, say) has no change to
              # select from, so it replays everything.
              selection=(--all) ;;
          esac
          echo "ck-mutate run ${selection[*]}"
          ck-mutate run "${selection[@]}" --report mutations.json

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutations
          path: mutations.json
          if-no-files-found: ignore
