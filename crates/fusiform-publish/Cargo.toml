[package]
name = "fusiform-publish"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
description = "Upstream fact diffs for the curated model store publisher"

[dependencies]
fusiform-core = { path = "../fusiform-core" }
fusiform-release = { path = "../fusiform-release" }
serde.workspace = true
serde_json = { workspace = true, features = ["arbitrary_precision", "raw_value"] }

[dev-dependencies]
fusiform-curate = { path = "../fusiform-curate" }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
async-compression = { version = "0.4", features = ["gzip", "tokio"] }
flate2 = "1"
fusiform-module = { path = "../fusiform-module" }
fusiform-store = { path = "../fusiform-store" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rusqlite.workspace = true
sha2 = "0.10"
tempfile = "3"
tokio = { workspace = true, features = ["fs", "io-util"] }
tokio-util = { version = "0.7", features = ["io"] }
