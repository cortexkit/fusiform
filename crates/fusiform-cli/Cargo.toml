[package]
name = "fusiform-cli"
version = "0.1.0"
edition = "2021"
publish = false
description = "Operator CLI for ck-fusiform, dispatched as `ck models`: read the catalog, a fact's history, what the daemon has been doing, and record corrections."
license = "MIT"

[[bin]]
name = "ck-models"
path = "src/main.rs"

[dependencies]
fusiform-module = { path = "../fusiform-module" }
fusiform-protocol = { path = "../fusiform-protocol" }
# For the fact-key namespace constants the plane flags and correct verb use.
fusiform-store = { path = "../fusiform-store" }

subc-client-rs = { workspace = true }
subc-protocol = { workspace = true }

serde_json = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
# Scratch directory for the `ckdev-` links the version test runs.
tempfile = "3"
