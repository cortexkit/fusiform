[package]
name = "fusiform-cli"
version = "0.1.0"
edition = "2021"
publish = false
description = "Operator CLI for ck-fusiform: read the catalog, a fact's history, and what the daemon has been doing."

[[bin]]
name = "fusiform"
path = "src/main.rs"

[dependencies]
fusiform-module = { path = "../fusiform-module" }
# For the fact-key namespace constants the plane flags select on.
fusiform-store = { path = "../fusiform-store" }

subc-client-rs = { workspace = true }
subc-core = { workspace = true }
subc-protocol = { workspace = true }

serde_json = { workspace = true }
tokio = { workspace = true }
