[package]
name = "fusiform-module"
version = "0.1.0"
edition = "2021"
publish = false
description = "The ck-fusiform daemon: fetches upstream catalogs on a cadence and serves the history."

[[bin]]
name = "ck-fusiform"
path = "src/main.rs"

[dependencies]
fusiform-core = { path = "../fusiform-core" }
fusiform-protocol = { path = "../fusiform-protocol" }
fusiform-store = { path = "../fusiform-store" }

subc-client-rs = { workspace = true }
subc-protocol = { workspace = true }
cortexkit-store-types = { workspace = true }

async-trait = { workspace = true }
blake3 = { workspace = true }
# Matching the version and feature set every other fetching module in the fleet
# uses: rustls rather than the platform TLS stack, so a module's behaviour does
# not depend on which machine built it.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { workspace = true }
serde_json = { workspace = true, features = ["arbitrary_precision"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "sync"] }

[dev-dependencies]
fusiform-testkit = { workspace = true }
# Only to POISON a store in a test: dropping the table an adoption read queries
# is the cheapest way to drive a real store-read failure, and the alternative
# was a test that calls the flag setter directly and therefore cannot see the
# read that is supposed to call it.
rusqlite = { workspace = true }
tempfile = "3"
# Verifies the compiled-in snapshot against the sha256 the refresh script
# recorded. Must be sha256 specifically: checking a different hash would verify
# the test's own arithmetic rather than what the script wrote.
sha2 = "0.10"
# Validates the engram enrollment with engram's OWN parser rather than a
# reimplementation of it. A schema check written here would assert my reading of
# their format; theirs asserts the format.
#
# The `client` feature is required, not optional: `engram_core::catalog` is
# gated behind it. Building with default-features = false compiles and then
# fails at the import, because the module simply is not there. `capture-db` is
# left off — it links a bundled SQLite that a JSON parse has no use for.
engram-core = { path = "../../../engram/engram-core", default-features = false, features = ["client"] }
