[package]
name = "fusiform-publish-wasm"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
description = "Byte-oriented WebAssembly API for the curated model store publisher"

[lib]
crate-type = ["cdylib"]

[dependencies]
fusiform-core = { path = "../fusiform-core" }
fusiform-curate = { path = "../fusiform-curate" }
fusiform-publish = { path = "../fusiform-publish" }
fusiform-release = { path = "../fusiform-release" }
serde.workspace = true
serde_json = { workspace = true, features = ["arbitrary_precision", "raw_value"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "=0.3.104"
wasm-bindgen = "=0.2.127"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
fusiform-module = { path = "../fusiform-module", features = ["test-support"] }
