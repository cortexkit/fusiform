[workspace]
resolver = "2"
members = ["crates/fusiform-core",
    "crates/fusiform-protocol", "crates/fusiform-store", "crates/fusiform-module", "crates/fusiform-cli",
    "crates/fusiform-testkit"]

# The daemon contract is a library rather than a template: HELLO, HELLO_ACK,
# route binding, health control and the frame lifecycle all live in
# subc-client-rs, and re-deriving any of them by hand is how a module ends up
# subtly wrong at handshake.
#
# Every CortexKit dependency comes from crates.io rather than a sibling
# checkout, so the build depends on what subconscious and commons released
# instead of whatever their working trees hold today, and the repository
# builds from a clone of itself alone.
[workspace.dependencies]
fusiform-testkit = { path = "crates/fusiform-testkit" }
subc-client-rs = "0.26.0"
subc-protocol = "0.29.0"
subc-transport = "0.10.0"

cortexkit-store = { version = "0.2.0", features = ["sqlite"] }
cortexkit-store-types = "0.2.2"

async-trait = "0.1"
blake3 = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
