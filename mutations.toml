equivalent = "Dead under the gate above it: inherit_rate_for returns early when the row carries any rate.* key, and every key this loop considers starts with rate., so facts.contains_key(&key) is always false when it runs. Proved SURVIVED across the whole fusiform-module package. Drop this marker if the publishes_a_rate gate is ever narrowed, because this check then becomes the only thing keeping a published rate from being overwritten."
