# Mutation proofs for fusiform's standing guards, replayed by ck-mutate.
#
# Each row breaks one guarded rule (`old` replaced by `new`) and names, by full
# libtest path, the tests that must go red. CI replays the rows a change touches
# on every push and every row nightly; see the README's "Mutation proofs"
# section for how to add one. Prefer `ck-mutate prove`, which appends a row only
# when the named tests actually fail.
[[control]]
id = "correction-never-creates-a-fact"
guards = "a correction naming a fact with no recorded history is refused, never planned into existence"
file = "crates/fusiform-store/src/correct.rs"
old = "            refusals.push(CorrectionRefusal::NoSuchFact {"
new = "            let _ = (CorrectionRefusal::NoSuchFact {"
edits = []
test_file = "crates/fusiform-store/tests/it/correct.rs"
runner = "cargo"
package = "fusiform-store"
target = "--test it"
expect_red = ["correct::correcting_a_fact_with_no_history_is_refused"]
only = false
timeout_s = 600


[[control]]
id = "point-in-time-boundary-inclusive-outer"
guards = "a point-in-time read AT an era's boundary instant serves that era (outer select's <=)"
file = "crates/fusiform-store/src/serve.rs"
old = '       AND e.boundary_at_ms <= ?2 \'
new = '       AND e.boundary_at_ms < ?2 \'
edits = []
test_file = "crates/fusiform-store/tests/it/serve.rs"
runner = "cargo"
package = "fusiform-store"
target = "--test it"
